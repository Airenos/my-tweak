name: Build iOS Dylib

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-linux:
    name: Build via Linux (Theos Docker)
    runs-on: ubuntu-latest
    container:
      image: nosskirneh/theos-docker:for-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git permissions
        run: git config --global --add safe.directory "*"

      - name: Compile Tweak
        run: |
          make package FINALPACKAGE=1
          find .theos/ -name "*.dylib" -exec cp {} ./ETAlienSpeedup.dylib \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ETAlienSpeedup-build
          path: |
            ETAlienSpeedup.dylib
            packages/*.deb
