name: Build iOS Dylib

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build arm64 Dylib (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile arm64 Dylib with Apple Clang
        run: |
          echo "Locating iPhoneOS SDK..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK at: $SDK_PATH"
          
          clang -dynamiclib \
            -isysroot "$SDK_PATH" \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -framework Foundation \
            -framework UIKit \
            -framework AVFoundation \
            -fobjc-arc \
            -O3 \
            ETAlienSpeedup.m \
            -o ETAlienSpeedup.dylib
          
          echo "Verifying compiled Mach-O architecture:"
          file ETAlienSpeedup.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETAlienSpeedup.dylib
          path: ETAlienSpeedup.dylib
